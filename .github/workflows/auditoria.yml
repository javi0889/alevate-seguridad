# Auditoría (workflow REUTILIZABLE). No corre en este repo público: lo llama el repo
# privado javi0889/alevate-auditoria con su cron mensual, y los registros y secretos
# quedan allá. Aun así, el script solo imprime totales: nada de repos, rutas ni hallazgos.
name: Auditoría

on:
  workflow_call:
    inputs:
      repos:
        description: Lista de repos en JSON (vacío = repos.json del vault)
        type: string
        default: ''
      ref-seguridad:
        description: SHA de alevate-seguridad a usar (el mismo con que se llama este workflow)
        type: string
        default: ''
      guardar-en-vault:
        description: true = guarda el reporte en el vault; false = lo deja como artefacto privado del run
        type: boolean
        default: false
    # Todos opcionales: si falta el token de un repo, ese repo se salta y queda anotado.
    # TOKEN_AUDITORIA (clásico, a futuro) cubre los repos sin token propio y el vault.
    secrets:
      TOKEN_AUDITORIA:
        required: false
      TOKEN_JAVIER:
        description: Fine-grained de javi0889, Contents read en sus repos auditados
        required: false
      TOKEN_FRANCO:
        description: Fine-grained de saencopra-spec, Contents read en sus repos auditados
        required: false
      TOKEN_VAULT:
        description: Fine-grained de saencopra-spec, Contents read/write solo en alevate-vault
        required: false
      TELEGRAM_BOT_TOKEN:
        required: false
      TELEGRAM_CHAT_ID:
        required: false

permissions:
  contents: read

jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: javi0889/alevate-seguridad
          ref: ${{ inputs.ref-seguridad }}
          persist-credentials: false
      - name: Clonar el vault
        if: inputs.repos == '' || inputs.guardar-en-vault
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: saencopra-spec/alevate-vault
          token: ${{ secrets.TOKEN_VAULT || secrets.TOKEN_AUDITORIA }}
          path: vault
          persist-credentials: ${{ inputs.guardar-en-vault }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Instalar gitleaks 8.30.1 (con checksum)
        run: |
          set -euo pipefail
          V=8.30.1
          cd "$RUNNER_TEMP"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_checksums.txt"
          grep "gitleaks_${V}_linux_x64.tar.gz" "gitleaks_${V}_checksums.txt" | sha256sum -c - > /dev/null
          tar -xzf "gitleaks_${V}_linux_x64.tar.gz" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Auditar
        id: auditar
        continue-on-error: true
        env:
          VAULT_DIR: vault
          REPOS_JSON: ${{ inputs.repos }}
          REPORTE_DIR: ${{ !inputs.guardar-en-vault && format('{0}/reporte', runner.temp) || '' }}
          TOKEN_AUDITORIA: ${{ secrets.TOKEN_AUDITORIA }}
          TOKEN_JAVIER: ${{ secrets.TOKEN_JAVIER }}
          TOKEN_FRANCO: ${{ secrets.TOKEN_FRANCO }}
          TOKEN_VAULT: ${{ secrets.TOKEN_VAULT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node auditoria/auditar.mjs
      - name: Reporte como artefacto privado (1 día)
        if: ${{ !inputs.guardar-en-vault }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reporte-auditoria
          path: ${{ runner.temp }}/reporte/
          retention-days: 1
          if-no-files-found: error
      - name: Guardar el reporte en el vault
        if: inputs.guardar-en-vault
        working-directory: vault
        run: |
          git config user.name "alevate-auditoria"
          git config user.email "auditoria@users.noreply.github.com"
          git add 11-Seguridad-Legal/auditorias/
          git diff --cached --quiet || git commit -q -m "Auditoría mensual $(date -u +%F)"
          git pull -q --rebase && git push -q
      - name: Marcar en rojo si hubo críticos
        if: steps.auditar.outcome == 'failure'
        run: |
          echo "Hay hallazgos críticos: ver el reporte en el vault."
          exit 1
